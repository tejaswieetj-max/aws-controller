[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spendctl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[dynamodb,stepfunctions]>=5", "ruff>=0.4", "matplotlib>=3.8", "numpy>=1.26", "pyarrow>=17", "aws-cdk-lib>=2.130", "constructs>=10"]

[tool.pytest.ini_options]
pythonpath = ["services", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE001"]

[tool.setuptools.packages.find]
where = ["services", "src"]
